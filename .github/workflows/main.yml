name: Pipeline CI/CD Avanzado (Docker & GHCR)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos necesarios para escribir e interactuar con el Registry de GitHub (GHCR)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # JOB 1: CI - Integración Continua (Pruebas)
  # -------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          #cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Pruebas
        run: npm test

  # -------------------------------------------------------------
  # JOB 2: Build & Push de la Imagen Docker (Solo en branch main)
  # -------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Autenticación en GitHub Container Registry
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub

      # Configuración de metadata (tags dinámicas según commit y 'latest')
      - name: Extraer Metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Construcción y publicación de la imagen
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # JOB 3: CD - Despliegue en Servidor
  # -------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Simular Despliegue mediante SSH
        run: |
          echo "Conectando al servidor mediante SSH..."
          echo "Descargando imagen: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Ejecutando: docker stop app || true && docker rm app || true"
          echo "Ejecutando: docker run -d -p 80:3000 --name app ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "¡Despliegue completado exitosamente!"